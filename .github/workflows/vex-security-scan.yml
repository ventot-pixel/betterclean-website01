name: Vex Security Scan

on:
  schedule:
    # Mon, Thu, Sat, Sun at 12:00 Helsinki (09:00 UTC, UTC+3 summer)
    - cron: '0 9 * * 0,1,4,6'
  workflow_dispatch:
    inputs:
      verification_only:
        description: Verify the dedicated Supabase monitor key without alerts or other provider checks
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  vex-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check 1 — Supabase Auth
        id: supabase
        env:
          VERIFICATION_ONLY: ${{ inputs.verification_only || false }}
        run: |
          echo "--- Supabase Auth Check ---"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/admin/users?page=1&per_page=50" \
            -H "apikey: ${{ secrets.SUPABASE_BETTERCLEAN_MONITOR_SECRET_KEY }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "SUPABASE_STATUS=ERROR (HTTP $HTTP_CODE)" >> $GITHUB_ENV
            if [ "$VERIFICATION_ONLY" = "true" ]; then
              exit 1
            fi
          else
            USER_COUNT=$(echo "$BODY" | grep -o '"id"' | wc -l | tr -d ' ')
            # Flag if any user created in last 24h
            RECENT=$(echo "$BODY" | grep -o '"created_at":"202[0-9]-[0-9][0-9]-[0-9][0-9]T[0-9][0-9]' | head -3)
            echo "SUPABASE_STATUS=OK — $USER_COUNT users found" >> $GITHUB_ENV
            echo "SUPABASE_RECENT=$RECENT" >> $GITHUB_ENV
            echo "Users: $USER_COUNT | Recent activity: $RECENT"
          fi

      - name: Check 2 — Error Log Review (Vercel deployments)
        id: errorlogs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.verification_only != true }}
        run: |
          echo "--- Error Log Review ---"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://api.vercel.com/v6/deployments?limit=5&target=production" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_API_TOKEN }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRORS_STATUS=ERROR (HTTP $HTTP_CODE)" >> $GITHUB_ENV
          else
            FAILED=$(echo "$BODY" | python3 -c "import sys,json; deps=json.load(sys.stdin).get('deployments',[]); print(sum(1 for d in deps if d.get('state')=='ERROR'))" 2>/dev/null || echo "0")
            echo "ERRORS_STATUS=OK — $FAILED failed deployments in last 5" >> $GITHUB_ENV
            echo "ERRORS_FAILED=$FAILED" >> $GITHUB_ENV
            echo "Failed deployments: $FAILED"
          fi

      - name: Build and Send Telegram Report
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.verification_only != true) }}
        run: |
          DATE=$(date '+%Y-%m-%d %H:%M UTC')

          # Determine severity
          FAILED="${{ env.ERRORS_FAILED }}"

          if [ "$FAILED" -gt "0" ] 2>/dev/null; then
            STATUS="🟡 MEDIUM"
          else
            STATUS="🟢 CLEAN"
          fi

          MESSAGE=$(printf '%s\n' \
            "Vex Security Report — $DATE" \
            "Status: $STATUS" \
            "" \
            "1. Supabase Auth: ${{ env.SUPABASE_STATUS }}" \
            "2. Error Logs: ${{ env.ERRORS_STATUS }}" \
            "3. External reputation: retired — no compliant provider configured" \
            "4. Local ClamAV: retired 2026-06-23" \
            "" \
            "Next scan: Mon/Thu/Sat/Sun 12:00 Helsinki")

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE"
