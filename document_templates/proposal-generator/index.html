<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterClean - Proposal Generator</title>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #3aaa35;
      --green-dark: #2a8226;
      --green-light: #edf7ec;
      --teal: #0fb8c9;
      --dark: #1a2e1a;
      --ink: #121812;
      --muted: #5f6b5f;
      --line: #dfe9df;
      --line-strong: #bfd5bf;
      --paper: #ffffff;
      --surface: #f7fbf7;
      --button-shadow: 0 4px 16px rgba(58,170,53,0.28);
    }

    * { box-sizing: border-box; }

    html {
      background: var(--surface);
      color: var(--ink);
      font-family: "Inter", Arial, sans-serif;
      line-height: 1.55;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(237, 247, 236, 0.8), rgba(255, 255, 255, 0) 360px),
        var(--surface);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      width: min(1680px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 12px 0 22px;
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .brand-lockup img {
      width: 168px;
      height: auto;
      display: block;
    }

    .header-copy {
      min-width: 0;
    }

    .eyebrow,
    label,
    .mini-label,
    .doc-type {
      color: var(--muted);
      font-family: "Sora", Arial, sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3 {
      font-family: "Sora", Arial, sans-serif;
      letter-spacing: 0;
    }

    h1 {
      color: var(--dark);
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      margin: 4px 0 0;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .tool-layout {
      display: grid;
      grid-template-columns: minmax(360px, 520px) minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }

    .form-panel,
    .preview-panel {
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      box-shadow: 0 18px 42px rgba(26, 46, 26, 0.08);
    }

    .form-panel {
      position: sticky;
      top: 14px;
      max-height: calc(100vh - 28px);
      overflow: auto;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      color: var(--dark);
      font-size: 18px;
      margin: 0;
    }

    .form-section {
      padding: 18px;
      border-bottom: 1px solid var(--line);
    }

    .form-section:last-child {
      border-bottom: 0;
    }

    .form-section h2 {
      color: var(--green-dark);
      font-size: 16px;
      margin: 0 0 14px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    input,
    select,
    textarea {
      width: 100%;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 10px 11px;
      outline: none;
      min-height: 42px;
    }

    textarea {
      resize: vertical;
      min-height: 92px;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: var(--green);
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(58, 170, 53, 0.15);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      padding: 9px 13px;
      color: var(--dark);
      background: #fff;
      font-family: "Sora", Arial, sans-serif;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      transition: transform 160ms cubic-bezier(0.2, 0.8, 0.2, 1), opacity 160ms ease, border-color 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .btn:hover {
      border-color: var(--green);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:focus-visible {
      outline: 3px solid rgba(15, 184, 201, 0.35);
      outline-offset: 2px;
    }

    .btn.primary {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      box-shadow: var(--button-shadow);
    }

    .btn.primary:hover {
      background: var(--green-dark);
      border-color: var(--green-dark);
    }

    .btn.danger {
      color: #7c1f1f;
      border-color: #e7bcbc;
      background: #fffafa;
    }

    .segmented {
      display: inline-flex;
      padding: 3px;
      background: var(--green-light);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      gap: 3px;
    }

    .segmented button {
      border: 0;
      border-radius: 5px;
      padding: 8px 10px;
      color: var(--muted);
      background: transparent;
      font-family: "Sora", Arial, sans-serif;
      font-size: 12px;
      font-weight: 800;
    }

    .segmented button.active {
      color: #fff;
      background: var(--green);
      box-shadow: 0 3px 10px rgba(58, 170, 53, 0.22);
    }

    .option-toggle {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .option-toggle label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .option-toggle input {
      width: 16px;
      min-height: auto;
      accent-color: var(--green);
    }

    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .summary-item {
      padding: 10px;
      background: var(--green-light);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
    }

    .summary-value {
      display: block;
      color: var(--dark);
      font-family: "Sora", Arial, sans-serif;
      font-size: 17px;
      font-weight: 800;
      margin-top: 2px;
    }

    .preview-panel {
      padding: 18px;
    }

    .proposal-page {
      width: min(100%, 210mm);
      margin: 0 auto;
      padding: 14mm;
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: 0 14px 34px rgba(26, 46, 26, 0.12);
    }

    .proposal-topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 5mm;
      margin-bottom: 7mm;
      border-bottom: 2px solid var(--green);
    }

    .proposal-logo {
      width: 40mm;
      display: block;
      margin-bottom: 2mm;
    }

    .proposal-page h2 {
      color: var(--green-dark);
      font-size: 20px;
      line-height: 1.25;
      margin: 24px 0 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line-strong);
    }

    .proposal-title {
      color: var(--dark);
      font-family: "Sora", Arial, sans-serif;
      font-size: 34px;
      line-height: 1.08;
      margin: 0 0 8px;
    }

    .proposal-subtitle {
      color: var(--muted);
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 24px;
    }

    .proposal-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px 30px;
      padding: 18px 0 20px;
      margin-bottom: 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .meta-row {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr);
      gap: 12px;
      align-items: baseline;
    }

    .proposal-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      overflow: hidden;
      font-size: 13px;
      margin: 12px 0 18px;
    }

    .proposal-table th,
    .proposal-table td {
      padding: 10px 11px;
      border-top: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .proposal-table th {
      background: #f7fbf6;
      border-top: 0;
      font-weight: 800;
    }

    .proposal-table .amount {
      text-align: right;
      white-space: nowrap;
    }

    .proposal-table .total-row td {
      border-top: 2px solid var(--green);
      font-weight: 800;
    }

    .scope-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .scope-box {
      padding: 14px 16px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      break-inside: avoid;
    }

    .scope-box h3 {
      color: var(--green-dark);
      font-size: 16px;
      margin: 0 0 8px;
    }

    .scope-box ul,
    .proposal-page ul {
      margin: 0 0 10px;
      padding-left: 18px;
    }

    .scope-box li,
    .proposal-page li {
      margin-bottom: 4px;
    }

    .terms-list {
      columns: 2;
      column-gap: 28px;
    }

    .choice-line,
    .proposal-note {
      padding: 12px 14px;
      border: 1px solid var(--line-strong);
      border-left: 3px solid var(--green);
      border-radius: 5px;
      background: var(--green-light);
    }

    .choice-line {
      background: #fff;
      font-weight: 800;
    }

    .signature-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
      margin-top: 18px;
    }

    .signature-box {
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .footer-note {
      margin-top: 24px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1120px) {
      .tool-layout {
        grid-template-columns: 1fr;
      }

      .form-panel {
        position: static;
        max-height: none;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        width: min(100% - 18px, 1680px);
        padding-top: 12px;
      }

      .app-header,
      .brand-lockup {
        align-items: flex-start;
        flex-direction: column;
      }

      .header-actions {
        justify-content: flex-start;
      }

      .field-grid,
      .summary-strip,
      .proposal-meta,
      .scope-grid,
      .signature-grid,
      .option-toggle {
        grid-template-columns: 1fr;
      }

      .proposal-page {
        padding: 18px;
      }

      .proposal-title {
        font-size: 28px;
      }

      .proposal-topbar {
        flex-direction: column;
      }

      .meta-row {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .terms-list {
        columns: 1;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .app-header,
      .form-panel,
      .panel-header {
        display: none !important;
      }

      .app-shell,
      .preview-panel,
      .proposal-page {
        width: auto;
        max-width: none;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
        background: #fff;
      }

      .tool-layout {
        display: block;
      }

      .proposal-page {
        font-size: 9.4pt;
      }

      .proposal-title {
        font-size: 23pt;
      }

      .proposal-page h2 {
        font-size: 13.4pt;
        margin: 6mm 0 2.6mm;
        padding-top: 2.6mm;
        break-after: avoid;
      }

      .proposal-topbar,
      .proposal-meta,
      .scope-box,
      .proposal-table,
      .choice-line,
      .proposal-note,
      .signature-grid {
        break-inside: avoid;
      }

      @page {
        size: A4;
        margin: 12mm 14mm 15mm;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <img src="../proposals/window-cleaning/assets/betterclean-logo-cropped.png" alt="BetterClean">
        <div class="header-copy">
          <div class="eyebrow" data-en="Internal tool" data-fi="Sisäinen työkalu">Sisäinen työkalu</div>
          <h1 data-en="Proposal Generator" data-fi="Tarjousgeneraattori">Tarjousgeneraattori</h1>
        </div>
      </div>
      <div class="header-actions">
        <div class="segmented">
          <button type="button" data-ui-lang="fi" class="active">FI</button>
          <button type="button" data-ui-lang="en">EN</button>
        </div>
        <button class="btn" type="button" id="copyData" data-en="Copy data" data-fi="Kopioi tiedot">Kopioi tiedot</button>
        <button class="btn" type="button" id="downloadHtml" data-en="Download HTML" data-fi="Lataa HTML">Lataa HTML</button>
        <button class="btn primary" type="button" id="printPdf" data-en="Print / Save PDF" data-fi="Tulosta / tallenna PDF">Tulosta / tallenna PDF</button>
      </div>
    </header>

    <main class="tool-layout">
      <aside class="form-panel">
        <div class="panel-header">
          <h2 class="panel-title" data-en="Proposal details" data-fi="Tarjouksen tiedot">Tarjouksen tiedot</h2>
          <button class="btn danger" type="button" id="resetForm" data-en="Reset" data-fi="Tyhjennä">Tyhjennä</button>
        </div>

        <section class="form-section">
          <h2 data-en="Output" data-fi="Lopputulos">Lopputulos</h2>
          <div class="field-grid">
            <div class="field">
              <label for="docLang" data-en="Document language" data-fi="Dokumentin kieli">Dokumentin kieli</label>
              <select id="docLang" data-field="docLang">
                <option value="en">English</option>
                <option value="fi">Finnish</option>
              </select>
            </div>
            <div class="field">
              <label for="serviceType" data-en="Service" data-fi="Palvelu">Palvelu</label>
              <select id="serviceType" data-field="serviceType">
                <option value="window">Window cleaning</option>
              </select>
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2 data-en="Customer" data-fi="Asiakas">Asiakas</h2>
          <div class="field-grid">
            <div class="field">
              <label for="clientName" data-en="Customer / company" data-fi="Asiakas / yritys">Asiakas / yritys</label>
              <input id="clientName" data-field="clientName" type="text">
            </div>
            <div class="field">
              <label for="contactPerson" data-en="Contact person" data-fi="Yhteyshenkilö">Yhteyshenkilö</label>
              <input id="contactPerson" data-field="contactPerson" type="text">
            </div>
            <div class="field full">
              <label for="clientAddress" data-en="Billing address" data-fi="Laskutusosoite">Laskutusosoite</label>
              <input id="clientAddress" data-field="clientAddress" type="text">
            </div>
            <div class="field full">
              <label for="serviceSite" data-en="Service site" data-fi="Kohde">Kohde</label>
              <input id="serviceSite" data-field="serviceSite" type="text">
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2 data-en="Document" data-fi="Dokumentti">Dokumentti</h2>
          <div class="field-grid">
            <div class="field">
              <label for="proposalNumber" data-en="Proposal number" data-fi="Tarjousnumero">Tarjousnumero</label>
              <input id="proposalNumber" data-field="proposalNumber" type="text">
            </div>
            <div class="field">
              <label for="proposalDate" data-en="Date" data-fi="Päivämäärä">Päivämäärä</label>
              <input id="proposalDate" data-field="proposalDate" type="text">
            </div>
            <div class="field">
              <label for="validUntil" data-en="Valid until" data-fi="Voimassa asti">Voimassa asti</label>
              <input id="validUntil" data-field="validUntil" type="text">
            </div>
            <div class="field">
              <label for="preparedBy" data-en="Prepared by" data-fi="Laatija">Laatija</label>
              <input id="preparedBy" data-field="preparedBy" type="text">
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2 data-en="Scope options" data-fi="Työvaihtoehdot">Työvaihtoehdot</h2>
          <div class="option-toggle">
            <label><input type="radio" name="selectedOption" value="A" data-field="selectedOption"> <span data-en="Option A" data-fi="Vaihtoehto A">Vaihtoehto A</span></label>
            <label><input type="radio" name="selectedOption" value="B" data-field="selectedOption"> <span data-en="Option B" data-fi="Vaihtoehto B">Vaihtoehto B</span></label>
          </div>
          <div class="field-grid" style="margin-top: 12px;">
            <div class="field">
              <label for="optionAHours" data-en="Option A hours" data-fi="Vaihtoehto A tunnit">Vaihtoehto A tunnit</label>
              <input id="optionAHours" data-field="optionAHours" type="number" min="0" step="0.5">
            </div>
            <div class="field">
              <label for="optionBHours" data-en="Option B hours" data-fi="Vaihtoehto B tunnit">Vaihtoehto B tunnit</label>
              <input id="optionBHours" data-field="optionBHours" type="number" min="0" step="0.5">
            </div>
            <div class="field full">
              <label for="optionAIncludes" data-en="Option A included work" data-fi="Vaihtoehto A sisältö">Vaihtoehto A sisältö</label>
              <textarea id="optionAIncludes" data-field="optionAIncludes"></textarea>
            </div>
            <div class="field full">
              <label for="optionBIncludes" data-en="Option B included work" data-fi="Vaihtoehto B sisältö">Vaihtoehto B sisältö</label>
              <textarea id="optionBIncludes" data-field="optionBIncludes"></textarea>
            </div>
            <div class="field full">
              <label for="optionBExcludes" data-en="Option B exclusions" data-fi="Vaihtoehto B ei sisällä">Vaihtoehto B ei sisällä</label>
              <textarea id="optionBExcludes" data-field="optionBExcludes"></textarea>
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2 data-en="Schedule" data-fi="Aikataulu">Aikataulu</h2>
          <div class="field-grid">
            <div class="field">
              <label for="phase1" data-en="Phase 1" data-fi="Vaihe 1">Vaihe 1</label>
              <input id="phase1" data-field="phase1" type="text">
            </div>
            <div class="field">
              <label for="phase2" data-en="Phase 2" data-fi="Vaihe 2">Vaihe 2</label>
              <input id="phase2" data-field="phase2" type="text">
            </div>
            <div class="field">
              <label for="phase3" data-en="Phase 3" data-fi="Vaihe 3">Vaihe 3</label>
              <input id="phase3" data-field="phase3" type="text">
            </div>
            <div class="field">
              <label for="phase4" data-en="Phase 4" data-fi="Vaihe 4">Vaihe 4</label>
              <input id="phase4" data-field="phase4" type="text">
            </div>
          </div>
        </section>

        <section class="form-section">
          <h2 data-en="Pricing" data-fi="Hinnoittelu">Hinnoittelu</h2>
          <div class="field-grid">
            <div class="field">
              <label for="baseRate" data-en="Base rate VAT 0%" data-fi="Perushinta ALV 0 %">Perushinta ALV 0 %</label>
              <input id="baseRate" data-field="baseRate" type="number" min="0" step="0.01">
            </div>
            <div class="field">
              <label for="discountRate" data-en="Discount per hour" data-fi="Alennus per tunti">Alennus per tunti</label>
              <input id="discountRate" data-field="discountRate" type="number" step="0.01">
            </div>
            <div class="field">
              <label for="vatRate" data-en="VAT %" data-fi="ALV %">ALV %</label>
              <input id="vatRate" data-field="vatRate" type="number" min="0" step="0.1">
            </div>
            <div class="field">
              <label for="additionalRate" data-en="Additional work rate" data-fi="Lisätyön tuntihinta">Lisätyön tuntihinta</label>
              <input id="additionalRate" data-field="additionalRate" type="number" min="0" step="0.01">
            </div>
            <div class="field">
              <label for="paymentTerm" data-en="Payment term" data-fi="Maksuehto">Maksuehto</label>
              <input id="paymentTerm" data-field="paymentTerm" type="text">
            </div>
            <div class="field">
              <label for="lateCancelFee" data-en="Late cancellation fee" data-fi="Myöhäinen peruutus">Myöhäinen peruutus</label>
              <input id="lateCancelFee" data-field="lateCancelFee" type="text">
            </div>
          </div>
          <div class="summary-strip">
            <div class="summary-item"><span class="mini-label">A</span><span class="summary-value" id="summaryA">0,00 €</span></div>
            <div class="summary-item"><span class="mini-label">B</span><span class="summary-value" id="summaryB">0,00 €</span></div>

      try {

        return { ...defaults };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function setUiLang(lang) {
      state.uiLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-en][data-fi]").forEach(el => {
        el.textContent = el.dataset[lang];
      });
      document.querySelectorAll("[data-ui-lang]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.uiLang === lang);
      });
      saveState();
    }

    function fillForm() {
      document.querySelectorAll("[data-field]").forEach(el => {
        const key = el.dataset.field;
        if (el.type === "radio") {
          el.checked = state[key] === el.value;
        } else {
          el.value = state[key] ?? "";
        }
      });
    }

    function readFormValue(el) {
      const key = el.dataset.field;
      if (el.type === "radio") {
        if (el.checked) state[key] = el.value;
      } else {
        state[key] = el.value;
      }
      saveState();
      render();
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function linesToList(value) {
      return String(value || "")
        .split("\n")
        .map(item => item.trim())
        .filter(Boolean)
        .map(item => `<li>${escapeHtml(item)}</li>`)
        .join("");
    }

    function numberValue(key) {
      const n = Number(String(state[key] || "0").replace(",", "."));
      return Number.isFinite(n) ? n : 0;
    }

    function money(value) {
      return new Intl.NumberFormat("fi-FI", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value) + " €";
    }

    function rate(value) {
      return money(value).replace(" €", " €/h");
    }

    function percentText(value) {
      const n = Number(String(value || "0").replace(",", "."));
      const formatted = Number.isFinite(n)
        ? new Intl.NumberFormat(state.docLang === "fi" ? "fi-FI" : "en-US", { maximumFractionDigits: 1 }).format(n)
        : String(value || "0");
      return state.docLang === "fi" ? `${formatted} %` : `${formatted}%`;
    }

    function displayTiming(value) {
      if (state.docLang === "fi" && value === "Completed") return "Tehty";
      return value;
    }

    function optionTotals(hours) {
      const base = numberValue("baseRate");
      const discount = numberValue("discountRate");
      const vatRate = numberValue("vatRate") / 100;
      const gross = hours * base;
      const discountTotal = hours * discount;
      const subtotal = gross - discountTotal;
      const vat = subtotal * vatRate;
      return {
        gross,
        discountTotal,
        subtotal,
        vat,
        total: subtotal + vat,
        netRate: base - discount
      };
    }

    function downloadHtml() {
      const doc = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(state.clientName)} proposal</title><style>${document.querySelector("style").textContent}</style></head><body><main class="proposal-page">${document.getElementById("proposalPreview").innerHTML}</main></body></html>`;
      const blob = new Blob([doc], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `betterclean-window-cleaning-proposal-${slugify(state.clientName)}-${state.docLang}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function slugify(value) {
      return String(value || "customer").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    async function copyData() {
      const text = JSON.stringify(state, null, 2);
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const area = document.createElement("textarea");
        area.value = text;
        document.body.appendChild(area);
        area.select();
        document.execCommand("copy");
        area.remove();
      }
    }

    function resetForm() {
      state = { ...defaults, uiLang: state.uiLang };
      saveState();
      fillForm();
      setUiLang(state.uiLang);
      render();
    }

    document.querySelectorAll("[data-field]").forEach(el => {
      el.addEventListener("input", () => readFormValue(el));
      el.addEventListener("change", () => readFormValue(el));
    });

    document.querySelectorAll("[data-ui-lang]").forEach(btn => {
      btn.addEventListener("click", () => setUiLang(btn.dataset.uiLang));
    });

    document.getElementById("printPdf").addEventListener("click", () => window.print());
    document.getElementById("downloadHtml").addEventListener("click", downloadHtml);
    document.getElementById("copyData").addEventListener("click", copyData);
    document.getElementById("resetForm").addEventListener("click", resetForm);

    fillForm();
    setUiLang(state.uiLang);
    render();
